<script>
const { useState, useEffect, useRef, useCallback, memo, useSyncExternalStore } = React;
const html = htm.bind(React.createElement);

/* ===== STORE (equivale a lib/game-store.ts) ===== */
const VERSAO = "2026-11-12 (pagamento automático)";
const SERIAL = "FF-0001", KEY = `fura-fura:${SERIAL}:v1`, TOTAL = 1000, DEF_PASS = "admin123";
// nome curto (ex: tv.jpg) vira premios/tv.jpg; links http(s) e fotos enviadas ficam como estão
const resolveImg = (v) => { v = (v || "").trim(); if (!v || /^(https?:|data:|\/|premios\/)/i.test(v)) return v; return "premios/" + v; };
const NUMS = [37, 112, 205, 288, 351, 429, 516, 603, 744, 891];
const seed = () => { const p = {}; NUMS.forEach((n, i) => { const k = String(i + 1).padStart(2, "0"); p[n] = { name: "Prêmio " + k, img: "premios/premio-" + k + ".png" }; }); return p; };
const init = () => ({ store: "Minha Loja", price: 5, passHash: "", prizes: seed(), holes: {}, current: 0, seeded: true, pixKey: "", pixQr: "", paid: 0, pend: 0, pendSince: 0, pixCity: "", pixDesc: "", apiUrl: "", charges: [], usadas: [] });
const parse = (r) => { try { if (r) { const d = JSON.parse(r); const s = { ...init(), ...d }; if (!d.seeded) { s.seeded = true; if (!d.prizes || !Object.keys(d.prizes).length) s.prizes = seed(); } return s; } } catch (e) {} return init(); };
const rd = () => { try { return localStorage.getItem(KEY); } catch (e) { return null; } };
const brl = (v) => new Intl.NumberFormat("pt-BR", { style: "currency", currency: "BRL" }).format(v);
async function sha256(t) {
  const b = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(t));
  return Array.from(new Uint8Array(b)).map((x) => x.toString(16).padStart(2, "0")).join("");
}
let state = null;
const ls = new Set();
const notify = () => ls.forEach((l) => l());
const snap = () => state || (state = parse(rd()));
function subscribe(cb) {
  ls.add(cb);
  const on = (e) => { if (e.key === KEY) { state = parse(e.newValue); notify(); } };
  window.addEventListener("storage", on);
  try { Promise.resolve(navigator.storage && navigator.storage.persist && navigator.storage.persist()).catch(() => {}); } catch (e) {}
  return () => { ls.delete(cb); window.removeEventListener("storage", on); };
}
function update(fn) {
  state = fn(snap());
  try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) {}
  notify();
}
const useGame = () => useSyncExternalStore(subscribe, snap);
const actions = {
  furar(n) {
    update((s) => (s.holes[n] || (s.paid || 0) <= 0) ? s : { ...s, paid: s.paid - 1, current: (s.current || 0) + 1, holes: { ...s.holes, [n]: (s.prizes[n] && !s.prizes[n].off) ? { prize: { name: s.prizes[n].name, img: s.prizes[n].img } } : {} } });
    return !!snap().holes[n]?.prize;
  },
  addPrize(n, name, img) {
    const s = snap();
    if (!Number.isInteger(n) || n < 1 || n > TOTAL) return "O número deve estar entre 1 e 1000.";
    if (s.holes[n]) return "Esse número já foi furado.";
    if (s.prizes[n]) return "Esse número já tem prêmio cadastrado.";
    if (!name.trim()) return "Informe o nome do prêmio.";
    update((p) => ({ ...p, prizes: { ...p.prizes, [n]: { name: name.trim(), img: resolveImg(img) } } }));
    return null;
  },
  removePrize(n) { update((s) => { const p = { ...s.prizes }; delete p[n]; return { ...s, prizes: p }; }); },
  editPrize(oldN, n, name, img) {
    const s = snap();
    if (!Number.isInteger(n) || n < 1 || n > TOTAL) return "O número deve estar entre 1 e 1000.";
    if (!name.trim()) return "Informe o nome do prêmio.";
    if (n !== oldN) {
      if (s.holes[oldN]) return "Esse prêmio já foi sorteado: o número não pode mudar.";
      if (s.holes[n]) return "Esse número já foi furado.";
      if (s.prizes[n]) return "Esse número já tem prêmio cadastrado.";
    }
    update((p) => { const pr = { ...p.prizes }; const off = pr[oldN] && pr[oldN].off; delete pr[oldN]; pr[n] = { name: name.trim(), img: resolveImg(img), ...(off ? { off: true } : {}) }; return { ...p, prizes: pr }; });
    return null;
  },
  togglePrize(n) { update((s) => ({ ...s, prizes: { ...s.prizes, [n]: { ...s.prizes[n], off: !s.prizes[n].off } } })); },
  resetCurrent() { update((s) => ({ ...s, current: 0 })); },
  savePix(key, qr, city, desc) { update((s) => ({ ...s, pixKey: key.trim(), pixQr: resolveImg(qr), pixCity: (city || "").trim(), pixDesc: (desc || "").trim() })); },
  addCredit() { update((s) => ({ ...s, pend: (s.pend || 0) + 1, pendSince: Date.now() })); },
  confirmPay() { update((s) => ({ ...s, paid: (s.paid || 0) + (s.pend || 0), pend: 0, pendSince: 0 })); },
  expirePend() { update((s) => ((s.pend || 0) > 0 ? { ...s, pend: 0, pendSince: 0 } : s)); },
  zeroCredits() { update((s) => ({ ...s, paid: 0, pend: 0, pendSince: 0 })); },
  saveApi(url) { update((s) => ({ ...s, apiUrl: (url || "").trim().replace(/\/+$/, "") })); },
  addCharge(c) { update((s) => ({ ...s, charges: [...(s.charges || []), c].slice(-5) })); },
  dropCharge(id) { update((s) => ({ ...s, charges: (s.charges || []).filter((x) => x.id !== id) })); },
  releaseCharge(id) {
    update((s) => {
      const c = (s.charges || []).find((x) => x.id === id);
      if (!c || (s.usadas || []).includes(id)) return s;
      const pend = Math.max(0, (s.pend || 0) - c.creditos);
      return { ...s, paid: (s.paid || 0) + c.creditos, pend, pendSince: pend ? s.pendSince : 0, charges: s.charges.filter((x) => x.id !== id), usadas: [...(s.usadas || []), id].slice(-50) };
    });
  },
  saveConfig(store, price) { update((s) => ({ ...s, store: store.trim() || s.store, price })); },
  reset() { update((s) => ({ ...s, holes: {}, current: 0, paid: 0, pend: 0, pendSince: 0 })); },
  async checkPass(p) { const s = snap(); return s.passHash ? (await sha256(p)) === s.passHash : p === DEF_PASS; },
  async changePass(cur, next, conf) {
    if (!(await actions.checkPass(cur))) return "Senha atual incorreta.";
    if (next.length < 4) return "A nova senha deve ter pelo menos 4 caracteres.";
    if (next !== conf) return "A confirmação não é igual à nova senha.";
    const h = await sha256(next);
    update((s) => ({ ...s, passHash: h }));
    return null;
  },
};

/* ===== COMPONENTES ===== */
const FOCUSABLE = 'button:not([disabled]), input:not([disabled]):not([type=file]), select, textarea, [tabindex="0"]';
function Modal({ title, onClose, wide, lock, children }) {
  const ref = useRef(null);
  useEffect(() => { const prev = document.activeElement; return () => { if (prev && prev.focus && document.contains(prev)) prev.focus({ preventScroll: true }); }; }, []);
  useEffect(() => { const r = ref.current; if (r && !r.contains(document.activeElement)) { const f = r.querySelector(FOCUSABLE); if (f) f.focus(); } });
  useEffect(() => {
    const k = (e) => {
      if (!lock && (e.key === "Escape" || e.key === "GoBack" || e.key === "BrowserBack" || e.keyCode === 4) && ref.current) {
        const d = document.querySelectorAll('[role="dialog"]');
        if (d[d.length - 1] === ref.current) { e.preventDefault(); onClose(); }
      }
    };
    window.addEventListener("keydown", k);
    return () => window.removeEventListener("keydown", k);
  }, [onClose, lock]);
  return html`<div className="fixed inset-0 z-50 flex items-end sm:items-center justify-center bg-black/70 p-3 backdrop-blur-sm" onClick=${lock ? undefined : onClose}>
    <div ref=${ref} role="dialog" aria-modal="true" aria-label=${title} onClick=${(e) => e.stopPropagation()} className=${"max-h-[90vh] w-full overflow-y-auto rounded-2xl border border-slate-700 bg-slate-800 p-5 shadow-2xl " + (wide ? "max-w-3xl" : "max-w-md")}>${children}</div>
  </div>`;
}

function PrizeImage({ src, className = "" }) {
  const [bad, setBad] = useState(false);
  if (!src || bad) return html`<span role="img" aria-label="Prêmio" className=${"inline-flex shrink-0 items-center justify-center bg-emerald-200 " + className}>🎁</span>`;
  return html`<img src=${src} alt="" onError=${() => setBad(true)} className=${"shrink-0 bg-white object-cover " + className} />`;
}

function fileToData(file) {
  return new Promise((res, rej) => {
    const r = new FileReader();
    r.onerror = () => rej();
    r.onload = () => {
      const im = new Image();
      im.onerror = () => rej();
      im.onload = () => {
        const s = Math.min(1, 320 / Math.max(im.width, im.height));
        const c = document.createElement("canvas");
        c.width = Math.round(im.width * s); c.height = Math.round(im.height * s);
        const x = c.getContext("2d");
        x.fillStyle = "#fff"; x.fillRect(0, 0, c.width, c.height);
        x.drawImage(im, 0, 0, c.width, c.height);
        res(c.toDataURL("image/jpeg", 0.82));
      };
      im.src = r.result;
    };
    r.readAsDataURL(file);
  });
}

const Cell = memo(function Cell({ n, hole, onPick, locked }) {
  if (!hole) return html`<button type="button" aria-label=${"Furar número " + n} disabled=${locked} onClick=${() => onPick(n)} className="aspect-square min-h-11 rounded-lg bg-blue-600 font-mono text-sm sm:text-base lg:text-xs xl:text-sm font-bold text-white transition active:scale-95 lg:rounded-md lg:hover:scale-110 lg:hover:bg-blue-500">${n}</button>`;
  if (hole.prize) return html`<button type="button" aria-label=${"Número " + n + ": premiado com " + hole.prize.name} onClick=${() => onPick(n)} className="flex aspect-square min-h-11 animate-pulse flex-col items-center justify-center gap-px overflow-hidden rounded-lg lg:rounded-md bg-emerald-400 p-0.5 text-slate-900 shadow-[0_0_14px_rgba(52,211,153,0.8)] ring-2 ring-emerald-200">
    <span className="font-mono text-[9px] font-bold leading-none">${n}</span>
    <${PrizeImage} key=${hole.prize.img} src=${hole.prize.img} className="h-5 w-5 sm:h-7 sm:w-7 lg:h-5 lg:w-5 xl:h-6 xl:w-6 rounded-full" />
    <span className="line-clamp-1 w-full px-px text-center text-[8px] font-bold leading-none">${hole.prize.name}</span>
  </button>`;
  return html`<div role="img" aria-label=${"Número " + n + ": perdeu"} className="flex aspect-square min-h-11 items-center justify-center rounded-lg lg:rounded-md bg-slate-700 text-[9px] sm:text-[10px] font-bold text-slate-400">PERDEU</div>`;
});

const inp = "w-full rounded-lg border border-slate-600 bg-slate-900 px-3 py-2 text-sm text-white placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-blue-500";
const btn = "rounded-lg px-4 py-2 text-sm font-bold ";
const Note = ({ m }) => m ? html`<p className=${"mt-2 text-sm font-semibold " + (m.ok ? "text-emerald-400" : "text-red-400")}>${m.ok ? "✅" : "⚠️"} ${m.t}</p>` : null;
const H = ({ children }) => html`<h3 className="mb-2 text-sm font-bold text-blue-300">${children}</h3>`;

/* ===== PIX copia e cola (BR Code) com valor ===== */
const semAcento = (t) => (t || "").normalize("NFD").replace(/[\u0300-\u036f]/g, "").replace(/[^A-Za-z0-9 ]/g, "").toUpperCase();
const crc16 = (str) => { let c = 0xFFFF; for (let i = 0; i < str.length; i++) { c ^= str.charCodeAt(i) << 8; for (let j = 0; j < 8; j++) c = (c & 0x8000) ? ((c << 1) ^ 0x1021) & 0xFFFF : (c << 1) & 0xFFFF; } return c.toString(16).toUpperCase().padStart(4, "0"); };
const tlv = (id, v) => id + String(v.length).padStart(2, "0") + v;
function normChave(k) {
  k = (k || "").trim();
  if (k.includes("@")) return k.toLowerCase();
  if (k.startsWith("+")) return "+" + k.replace(/\D/g, "");
  if (/^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/i.test(k)) return k.toLowerCase();
  return k.replace(/\D/g, "") || k;
}
function pixPayload(chave, valor, nome, cidade, desc) {
  const ch = normChave(chave);
  const d = (desc || "").normalize("NFD").replace(/[\u0300-\u036f]/g, "").replace(/[^A-Za-z0-9 -]/g, "").trim().slice(0, Math.min(40, Math.max(0, 99 - 18 - (4 + ch.length) - 4)));
  const conta = tlv("00", "br.gov.bcb.pix") + tlv("01", ch) + (d ? tlv("02", d) : "");
  let p = tlv("00", "01") + tlv("01", "11") + tlv("26", conta) + tlv("52", "0000") + tlv("53", "986");
  if (valor > 0) p += tlv("54", valor.toFixed(2));
  p += tlv("58", "BR") + tlv("59", (semAcento(nome) || "LOJA").slice(0, 25)) + tlv("60", (semAcento(cidade) || "BRASIL").slice(0, 15)) + tlv("62", tlv("05", d.replace(/[^A-Za-z0-9]/g, "").slice(0, 25) || "***")) + "6304";
  return p + crc16(p);
}
function PixQr({ payload, fallback }) {
  let url = "";
  try { const q = qrcode(0, "M"); q.addData(payload); q.make(); url = q.createDataURL(8, 4); } catch (e) {}
  if (!url) return fallback ? html`<${QrImg} key=${fallback} src=${fallback} />` : html`<p className="my-3 text-sm font-semibold text-red-300">Não foi possível gerar o QR Code.</p>`;
  return html`<img src=${url} alt="QR Code PIX" className="mx-auto my-3 h-[34vh] min-h-[12rem] w-[34vh] min-w-[12rem] rounded-xl bg-white p-1" style=${{ imageRendering: "pixelated" }} />`;
}

function QrImg({ src }) {
  const [bad, setBad] = useState(false);
  if (bad) return html`<p className="my-3 text-sm font-semibold text-red-300">Não foi possível carregar o QR Code.</p>`;
  return html`<img src=${resolveImg(src)} alt="QR Code PIX" onError=${() => setBad(true)} className="mx-auto my-3 h-[34vh] min-h-[12rem] w-[34vh] min-w-[12rem] rounded-xl bg-white object-contain p-2" />`;
}

function Galeria({ onPick, onClose }) {
  const [lista, setLista] = useState(null);
  const [erro, setErro] = useState("");
  const [ign, setIgn] = useState([]);
  const [fonte, setFonte] = useState("");
  useEffect(() => {
    const base = Array.from({ length: 10 }, (_, i) => "premio-" + String(i + 1).padStart(2, "0") + ".png");
    const ehImg = /\.(png|jpe?g|jfif|gif|webp|avif|bmp|svg)$/i;
    const viaJson = () => fetch("premios/lista.json", { cache: "no-store" })
      .then((r) => { if (!r.ok) throw new Error("lista.json: erro " + r.status); return r.json(); })
      .then((l) => { if (!Array.isArray(l)) throw new Error("lista.json: formato inválido"); setFonte("lista.json"); return l; });
    const h = location.hostname, repo = location.pathname.split("/")[1];
    // em github.io lê a própria pasta premios; se falhar, usa o lista.json
    const viaApi = () => fetch("https://api.github.com/repos/" + h.split(".")[0] + "/" + repo + "/contents/premios")
      .then((r) => { if (!r.ok) throw new Error("pasta premios: erro " + r.status); return r.json(); })
      .then((l) => { const f = l.filter((x) => x.type === "file" && x.name !== "lista.json"); setIgn(f.filter((x) => !ehImg.test(x.name)).map((x) => x.name)); setFonte("pasta"); return f.filter((x) => ehImg.test(x.name)).map((x) => x.name); });
    (h.endsWith(".github.io") && repo ? viaApi().catch(() => viaJson()) : viaJson())
      .then((l) => setLista([...new Set([...base, ...l])])).catch((e) => { setErro(e.message); setLista(base); });
  }, []);
  return html`<${Modal} title="Imagens da pasta" onClose=${onClose} wide=${true}>
    <div className="mb-3 flex items-center justify-between">
      <h2 className="text-lg font-bold">🖼 Imagens da pasta premios</h2>
      <button type="button" onClick=${onClose} className=${btn + "bg-slate-700 hover:bg-slate-600"}>Fechar ✕</button>
    </div>
    ${fonte && html`<p className="mb-2 text-xs text-slate-400">Fonte: ${fonte === "pasta" ? "pasta premios do GitHub" : "arquivo lista.json (só aparecem os nomes escritos nele)"} · ${lista ? lista.length : 0} imagens${ign.length ? " · ignorados (formato não aceito): " + ign.join(", ") : ""}</p>`}
    ${erro && html`<p className="mb-3 text-sm font-semibold text-amber-300">⚠️ Não consegui ler a pasta (${erro}). Mostrando só as imagens padrão.</p>`}
    ${lista === null && html`<p className="text-sm text-slate-400">Carregando...</p>`}
    ${lista && lista.length === 0 && html`<p className="text-sm text-slate-400">Nenhuma imagem encontrada${erro ? " (" + erro + ")" : ""}. Confira se a pasta premios está na raiz do repositório, ao lado do index.html, e tem imagens. Ou crie premios/lista.json com os nomes.</p>`}
    <div className="grid grid-cols-3 gap-2 sm:grid-cols-5">
      ${(lista || []).map((nome) => html`<button type="button" key=${nome} onClick=${() => onPick("premios/" + nome)} className="flex flex-col items-center gap-1 rounded-xl border border-slate-700 bg-slate-900 p-2 hover:border-blue-500">
        <${PrizeImage} src=${"premios/" + nome} className="h-20 w-20 rounded-lg" /><span className="max-w-full truncate text-[11px]">${nome}</span></button>`)}
    </div>
  <//>`;
}

function AdminPanel({ onClose }) {
  const g = useGame();
  const [auth, setAuth] = useState(false);

  const [cfg, setCfg] = useState(null);
  const [cur, setCur] = useState(""), [nw, setNw] = useState(""), [cf, setCf] = useState("");
  const [pm, setPm] = useState(null);
  const [pn, setPn] = useState(""), [pname, setPname] = useState(""), [pimg, setPimg] = useState("");
  const [edN, setEdN] = useState(null);
  const [gal, setGal] = useState(false);
  const [pk, setPk] = useState(g.pixKey || "");
  const [pc, setPc] = useState(g.pixCity || "");
  const [pd, setPd] = useState(g.pixDesc || "");
  const [au, setAu] = useState(g.apiUrl || "");
  const [qr, setQr] = useState(g.pixQr || "");
  const [galQ, setGalQ] = useState(false);
  const [pxm, setPxm] = useState(null);
  const [prm, setPrm] = useState(null);
  const [confirm, setConfirm] = useState(false);

  const entrar = async () => { if (await actions.checkPass(pw)) { setAuth(true); setLerr(""); } else setLerr("Senha incorreta"); };

  if (!auth) return html`<${Modal} title="Área do Administrador" onClose=${onClose}>
    <h2 className="text-lg font-bold">🔒 Área do Administrador</h2>
    <p className="mb-3 text-sm text-slate-400">Digite a senha para continuar.</p>
    <input type="password" autoFocus className=${inp} placeholder="Senha" value=${pw} onChange=${(e) => setPw(e.target.value)} onKeyDown=${(e) => e.key === "Enter" && entrar()} />
    ${lerr && html`<p className="mt-2 text-sm font-semibold text-red-400">⚠️ ${lerr}</p>`}
    <div className="mt-4 flex gap-2">
      <button type="button" onClick=${onClose} className=${btn + "flex-1 bg-slate-700 hover:bg-slate-600"}>Cancelar</button>
      <button type="button" onClick=${entrar} className=${btn + "flex-1 bg-blue-600 hover:bg-blue-500"}>Entrar</button>
    </div>
  <//>`;

  const testarApi = async () => {
    try {
      const r = await fetch(au.trim().replace(/\/+$/, "") + "/ping");

/* navegação por setas do controle remoto (Box TV) */
function useDpad() {
  useEffect(() => {
    const vis = (el) => { const r = el.getBoundingClientRect(); return r.width > 0 && r.height > 0 && getComputedStyle(el).visibility !== "hidden"; };
    const onKey = (e) => {
      const dir = { ArrowUp: [0, -1], ArrowDown: [0, 1], ArrowLeft: [-1, 0], ArrowRight: [1, 0] }[e.key];
      if (!dir || e.altKey || e.ctrlKey || e.metaKey) return;
      const a = document.activeElement;
      const txt = a && (a.tagName === "TEXTAREA" || (a.tagName === "INPUT" && !["button", "checkbox", "radio", "file"].includes(a.type)));
      if (txt && dir[0] !== 0 && a.selectionStart !== null) {
        if (dir[0] < 0 ? a.selectionStart > 0 : a.selectionEnd < a.value.length) return; // deixa o cursor andar no texto
      }
      const ds = document.querySelectorAll('[role="dialog"]');
      const scope = ds.length ? ds[ds.length - 1] : document;
      const list = [...scope.querySelectorAll(FOCUSABLE)].filter(vis);
      if (!list.length) return;
      let next = null;
      if (!a || a === document.body || !list.includes(a)) next = list[0];
      else {
        const ar = a.getBoundingClientRect(), ax = ar.left + ar.width / 2, ay = ar.top + ar.height / 2;
        let best = Infinity;
        for (const c of list) {
          if (c === a) continue;
          const r = c.getBoundingClientRect(), dx = r.left + r.width / 2 - ax, dy = r.top + r.height / 2 - ay;
          const main = dir[0] ? dx * dir[0] : dy * dir[1];
          if (main <= 2) continue;
          const score = main + Math.abs(dir[0] ? dy : dx) * 3;
          if (score < best) { best = score; next = c; }
        }
      }
      if (!next) { if (ds.length) e.preventDefault(); return; }
      e.preventDefault();
      next.focus({ preventScroll: true });
      next.scrollIntoView({ block: "center", inline: "nearest" });
    };
    window.addEventListener("keydown", onKey);
    return () => window.removeEventListener("keydown", onKey);
  }, []);
}

      </div>
      <div className="mx-auto w-full max-w-[1400px] rounded-xl border border-slate-800 bg-slate-950 p-2 sm:p-3">
        <div className="grid grid-cols-6 gap-1.5 min-[400px]:grid-cols-7 sm:grid-cols-10 sm:gap-2 md:grid-cols-12 lg:grid-cols-[repeat(20,minmax(0,1fr))] lg:gap-1 xl:grid-cols-[repeat(25,minmax(0,1fr))]">${cells}</div>
      </div>
    </main>
    <footer className="pb-6 text-center text-xs text-slate-500">Nº de série: ${SERIAL} · Versão ${VERSAO}</footer>

    ${view !== null && win && html`<${Modal} title="Número premiado!" onClose=${closeView}>
      <div className="text-center">
        <div className="text-4xl">🎉</div>
        <h2 className="mt-1 text-2xl font-extrabold text-emerald-400">Número premiado!</h2>
        <p className="mb-3 font-mono text-slate-300">Número ${view}</p>
        <${PrizeImage} key=${win.img} src=${win.img} className="mx-auto h-48 w-48 rounded-2xl text-6xl" />
        <p className="mt-3 text-xl font-bold">${win.name}</p>
        <button type="button" onClick=${closeView} className="mt-5 w-full rounded-xl bg-emerald-500 py-3 font-bold text-slate-900 hover:bg-emerald-400">Continuar</button>
      </div>
    <//>`}

    ${list && html`<${Modal} title="Prêmios" onClose=${closeList} wide=${true} lock=${true}>
      <div className="mb-4 flex items-center justify-between">
        <h2 className="text-xl font-bold">🎁 Prêmios</h2>
        <button type="button" onClick=${closeList} className="rounded-lg bg-slate-700 px-3 py-1 text-sm hover:bg-slate-600">Fechar ✕</button>
      </div>
      <h3 className="mb-2 text-sm font-bold text-blue-300">Ainda disponíveis (${disp.length})</h3>
      ${disp.length === 0 && html`<p className="mb-4 text-sm text-slate-400">Nenhum prêmio disponível no momento.</p>`}
      <div className="mb-5 grid grid-cols-2 gap-2 sm:grid-cols-3">
        ${disp.map((p, i) => html`<button type="button" key=${i} onClick=${() => setDetail({ ...p })} className="flex items-center gap-2 rounded-xl border border-slate-700 bg-slate-900 p-2 text-left hover:border-blue-500">
          <${PrizeImage} key=${p.img} src=${p.img} className="h-12 w-12 rounded-lg" /><span className="text-sm font-semibold leading-tight">${p.name}</span></button>`)}
      </div>
      <h3 className="mb-2 text-sm font-bold text-emerald-300">Já sorteados (${sorteados.length})</h3>
      ${sorteados.length === 0 && html`<p className="text-sm text-slate-400">Nenhum prêmio sorteado ainda.</p>`}
      <div className="grid grid-cols-2 gap-2 sm:grid-cols-3">
        ${sorteados.map(({ n, prize }) => html`<button type="button" key=${n} onClick=${() => setDetail({ ...prize, n })} className="flex items-center gap-2 rounded-xl border border-emerald-700 bg-emerald-950/40 p-2 text-left hover:border-emerald-400">
          <${PrizeImage} key=${prize.img} src=${prize.img} className="h-12 w-12 rounded-lg" />
          <span className="text-sm font-semibold leading-tight">${prize.name}<span className="block font-mono text-xs text-emerald-300">Nº ${n}</span></span></button>`)}
      </div>
    <//>`}

    ${aviso && html`<div className="fixed inset-x-3 bottom-4 z-[70] mx-auto w-fit max-w-full rounded-xl bg-emerald-500 px-5 py-3 text-center text-lg font-extrabold text-slate-900 shadow-2xl">✅ ${aviso}</div>`}

    ${pay && html`<${Modal} title="Pagamento" onClose=${closePay}>
      <div className="text-center">
        <h2 className="text-2xl font-extrabold text-amber-300">💲 Pagamento via PIX</h2>
        ${g.pixDesc && html`<p className="text-sm text-slate-300">Ponto de venda: ${g.pixDesc}</p>`}
        ${(g.pend || 0) === 0
          ? html`<p className="my-6 text-lg font-semibold">Adicione créditos antes de pagar.</p>`
          : html`<p className="mt-2 text-lg font-bold">${g.pend} crédito(s) × ${brl(g.price)} = <span className="text-emerald-300">${brl(g.pend * g.price)}</span></p><p className="text-sm text-amber-200">Tempo para pagar: ${mmss}. Depois disso, os créditos não pagos são cancelados.</p>`}
        ${payloadPix
          ? html`<${PixQr} key=${payloadPix} payload=${payloadPix} fallback=${g.pixQr} />
            <button type="button" onClick=${() => copiar(payloadPix)} className="rounded-lg bg-slate-700 px-4 py-2 text-sm font-bold hover:bg-slate-600">📋 Copiar código PIX (copia e cola)</button>
            ${copiado && html`<p className="mt-1 text-sm font-semibold text-emerald-300">${copiado}</p>`}`
          : (g.pixQr ? html`<${QrImg} key=${g.pixQr} src=${g.pixQr} />` : null)}
        ${(g.apiUrl && !erroCob && pendN > 0)
          ? (cobr
            ? html`<img src=${"data:image/png;base64," + cobr.b64} alt="QR Code PIX" className="mx-auto my-3 h-[34vh] min-h-[12rem] w-[34vh] min-w-[12rem] rounded-xl bg-white p-1" />
              <button type="button" onClick=${() => copiar(cobr.code)} className="rounded-lg bg-slate-700 px-4 py-2 text-sm font-bold hover:bg-slate-600">📋 Copiar código PIX (copia e cola)</button>
              ${copiado && html`<p className="mt-1 text-sm font-semibold text-emerald-300">${copiado}</p>`}
              <p className="mt-3 animate-pulse text-lg font-extrabold text-amber-300">⏳ Aguardando o pagamento… os créditos são liberados sozinhos</p>`
            : html`<p className="my-6 animate-pulse text-lg font-bold">Gerando a cobrança…</p>`)
          : g.pixKey
          ? html`<p className="mt-3 text-xs uppercase text-slate-400">Chave PIX</p><p className="break-all text-xl font-extrabold">${g.pixKey}</p>`
          : html`<p className="mt-3 text-sm font-semibold text-red-300">Chave PIX não cadastrada. Cadastre na Área do Administrador.</p>`}
        ${g.apiUrl && erroCob && html`<p className="mt-3 text-sm font-semibold text-red-300">Não foi possível gerar a cobrança automática (${erroCob}). Use o QR manual e confirme o pagamento.</p><button type="button" onClick=${() => setErroCob("")} className="rounded-lg bg-slate-700 px-4 py-2 text-sm font-bold hover:bg-slate-600">🔄 Tentar de novo</button>`}
        <div className="mt-5 flex gap-2">
          <button type="button" onClick=${closePay} className="rounded-xl bg-slate-600 px-5 py-3 font-bold hover:bg-slate-500">${(g.pend || 0) > 0 ? "Cancelar" : "Fechar"}</button>
          ${(g.pend || 0) > 0 && html`<button type="button" onClick=${() => { actions.confirmPay(); closePay(); }} className="flex-1 rounded-xl bg-emerald-500 py-3 font-bold text-slate-900 hover:bg-emerald-400">✅ Confirmar pagamento</button>`}
        </div>
      </div>
    <//>`}

    ${list && loop && cur && html`<${Modal} title="Prêmios em jogo" onClose=${closeLoop} wide=${true} lock=${true}>
      <div className="text-center">
        <div className="mb-3 flex items-center justify-between gap-2">
          <h2 className="text-xl font-extrabold text-amber-300 sm:text-3xl">🎁 Prêmios em jogo</h2>
          <button type="button" onClick=${closeLoop} className="rounded-lg bg-slate-700 px-4 py-2 text-sm font-bold hover:bg-slate-600">Fechar ✕</button>
        </div>
        <div key=${idx} className="ff-in">
          <${PrizeImage} key=${cur.img} src=${cur.img} className="mx-auto h-[38vh] w-[38vh] rounded-3xl text-8xl" />
          <p className="mt-3 text-3xl font-extrabold sm:text-5xl">${cur.name}</p>
        </div>
        <p className="mt-2 text-sm text-slate-400">Prêmio ${idx % disp.length + 1} de ${disp.length}</p>
        <div className="mx-auto mt-3 h-2 w-full max-w-md overflow-hidden rounded bg-slate-700"><div key=${idx} className="ff-bar h-full bg-amber-400"></div></div>
      </div>
    <//>`}

    ${detail && html`<${Modal} title=${detail.name} onClose=${closeDetail}>
      <div className="text-center">
        <p className=${"mb-2 text-sm font-bold " + (detail.n ? "text-emerald-300" : "text-blue-300")}>${detail.n ? "Já sorteado · Número " + detail.n : "Ainda disponível"}</p>
        <${PrizeImage} key=${detail.img} src=${detail.img} className="mx-auto h-48 w-48 rounded-2xl text-6xl" />
        <p className="mt-3 text-xl font-bold">${detail.name}</p>
        <button type="button" onClick=${closeDetail} className="mt-5 w-full rounded-xl bg-slate-600 py-3 font-bold hover:bg-slate-500">Fechar</button>
      </div>
    <//>`}

    ${admin && html`<${AdminPanel} onClose=${closeAdmin} />`}
  </div>`;
}

ReactDOM.createRoot(document.getElementById("root")).render(html`<${App} />`);
if ("serviceWorker" in navigator) { window.addEventListener("load", () => navigator.serviceWorker.register("./sw.js").catch(() => {})); }
</script>
</body>
</html>
